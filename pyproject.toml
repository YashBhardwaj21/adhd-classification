[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adhd200-connectomics"
version = "1.0.0"
description = "Research code for dynamic functional connectomics, ComBat harmonization, classical and quantum GNNs, and multi-site LOSO evaluation on ADHD-200."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shantanu Khare" },
    { name = "Bhavana Deepthi" },
    { name = "Yash Bhardwaj" }
]
keywords = [
    "neuroimaging",
    "functional-connectivity",
    "graph-neural-networks",
    "quantum-machine-learning",
    "ADHD-200",
    "reproducibility"
]

# Package-level core dependencies for editable development (`pip install -e .`).
# Track-specific execution environments with pinned versions are located under `environment/`.
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
quantum = [
    "pennylane==0.44.1",
    "pennylane-lightning-gpu==0.44.0"
]
neuro = [
    "bctpy>=0.5.2",
    "neuroCombat>=0.2.1",
    "monai>=1.3.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "notebooks",
    "src/exp08/neurostorm",
    "third_party",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293", "E402", "F841", "E741"]
